name: Build macOS ARM64

on:
  workflow_dispatch:

jobs:
  build-mac:
    name: Build OTClient macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install cmake ninja luajit boost openssl zlib glew physfs \
            libogg libvorbis openal-soft curl libpng protobuf nlohmann-json \
            asio pugixml fmt utf8cpp abseil parallel-hashmap \
            cpp-httplib stduuid

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTION_VCPKG_SUBMODULE=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DLUAJIT_INCLUDE_DIR=$(brew --prefix luajit)/include/luajit-2.1 \
            -DLUAJIT_LIBRARY=$(brew --prefix luajit)/lib/libluajit-5.1.dylib \
            -G Ninja
          ninja -j$(sysctl -n hw.logicalcpu)

      - name: Package
        run: |
          mkdir -p dist
          find build -name "otclient" -type f -exec cp {} dist/ \;
          cp -r data mods modules init.lua otclientrc.lua dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-macos-arm64
          path: dist/
          retention-days: 30
