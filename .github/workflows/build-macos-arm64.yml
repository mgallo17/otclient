name: Build macOS ARM64

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    name: Build OTClient macOS ARM64
    runs-on: macos-14
    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/ports
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install ninja pkg-config autoconf automake libtool mono

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Get vcpkg baseline
        run: |
          vcpkg_commit_id="$(grep 'builtin-baseline' vcpkg.json | awk -F'"' '{print $4}')"
          echo "VCPKG_GIT_COMMIT_ID=${vcpkg_commit_id}" >> $GITHUB_ENV

      - name: CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: "1G"
          key: ccache-macos-arm64-release
          restore-keys: ccache-macos-arm64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: macos-release
          buildPreset: macos-release
          configurePresetAdditionalArgs: "['-DOTCLIENT_BUILD_TESTS=OFF']"

      - name: Package
        run: |
          mkdir -p dist
          find build/macos-release -name "otclient" -type f -exec cp {} dist/ \;
          cp -r data mods modules init.lua otclientrc.lua dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-macos-arm64
          path: dist/
          retention-days: 30
