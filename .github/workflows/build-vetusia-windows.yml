name: Build Vetusia Client (Windows)

# So' sob demanda -- repo privado, minutos de Actions sao contados. Rodar
# manualmente na aba Actions quando quiser gerar um build novo pra testar.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile + empacotar (Windows x64)
    runs-on: windows-2025
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite;nugettimeout,600"
      VCPKG_NUGET_REPOSITORY: https://github.com/${{ github.repository }}.git
      VCPKG_NUGET_API_KEY: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # o repo raiz e' vetusia-server; o client fica no subdiretorio client/
          fetch-depth: 1

      - name: Get vcpkg baseline
        shell: pwsh
        working-directory: client
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $vcpkgCommitId = $json.'builtin-baseline'
          "VCPKG_GIT_COMMIT_ID=$vcpkgCommitId" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup NuGet source for GitHub Packages (cache do vcpkg)
        shell: pwsh
        run: |
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { throw "nuget.exe not found in PATH" }
          & $nuget sources remove -Name "GitHubPackages" 2>&1 | Out-Null
          & $nuget sources add -Name "GitHubPackages" -Source $feed -UserName "${{ github.repository_owner }}" -Password "$env:VCPKG_NUGET_API_KEY" -StorePasswordInClearText
          & $nuget setapikey "$env:VCPKG_NUGET_API_KEY" -Source $feed

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Configure + Build (CMake preset windows-release)
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: "${{ github.workspace }}/client/CMakeLists.txt"
          configurePreset: windows-release
          buildPreset: windows-release
          configurePresetAdditionalArgs: "['-DOTCLIENT_BUILD_TESTS=OFF', '-DENABLE_DISCORD_RPC=OFF']"

      - name: Empacotar (pasta + zip, sem console, com o icone/mapa)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path client\build\windows-release -Recurse -Filter otclient.exe | Select-Object -First 1
          if (-not $exe) { throw "otclient.exe nao encontrado -- build falhou?" }
          python client\tools\pack_portable.py $exe.FullName dist\vetusia-windows --data-dir client --zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vetusia-windows
          path: dist/vetusia-windows.zip
          retention-days: 30
